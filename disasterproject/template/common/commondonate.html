<body>

    <a class="navbar-brand" href="#index.html">

    </a> -->

                    data-target="#navbarTogglerDemo02" aria-controls="navbarTogglerDemo02" aria-expanded="false"
                    aria-label="Toggle navigation">

                <div class="collapse navbar-collapse" id="navbarTogglerDemo02">

                        <!-- <li class="nav-item @@contact__active">
        <a class="nav-link" href="" onclick="history.back()">Go Back</a>
        <button onclick="history.back()" class="nav-link" style="all: unset; margin-top: 15px;font-size: 20px;">Back</button>
      </li> -->

                        <li class="align-self">

                                    class="fa fa-heart mr-1"></span> Donate</a>

                    </ul>

                <!-- toggle switch for light and dark theme -->

                    <nav class="navigation">

    <!-- //header -->
    <!-- <div class="inner-banner">
  <section class="w3l-breadcrumb py-5">
      <div class="container py-lg-5 py-md-3">
          <h2 class="title">Login</h2>
      </div>
  </section>
</div> -->
    <!-- banner bottom shape -->
    <div class="position-relative">
        <div class="shape overflow-hidden">
            <svg viewBox="0 0 2880 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0 48H1437.5H2880V0H2160C1442.5 52 720 0 720 0H0V48Z" fill="currentColor"></path>
            </svg>
        </div>
    </div>
    <!-- banner bottom shape -->


    <section class="gray-bg section-padding" id="donation" style="background-color: #F8F9FA; padding-bottom: 10px">
        <!-- <div class=""> -->
        <div class="row">
            <div class="" style="margin: auto;">
                <div class="col-12">
                    <div class="box" style="background: #adadad">
                        <div class="form-area">
                            <form action="" class="form-horizontal" id="donation_add" name="donation_add" method="post"
                                accept-charset="utf-8">
                                {% csrf_token %}
                                <h3 style="margin-bottom: 25px; text-align: center;width: 450px;">Donation Form<br></h3>
                                <div class="form-group" id="name">
                                    <label for="donation_profile_name">Name</label>
                                    <input type="text" class="form-control" id="donation_profile_name" name="name"
                                        pattern="[a-z A-Z]+" placeholder="Full Name" required maxlength="100"
                                        onKeyPress="return StringValidation(event)">
                                </div>
                                <div class="form-group" id="email">
                                    <label for="donation_profile_email">Email id</label>
                                    <input type="email" class="form-control" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$" id="donation_profile_email" name="email"
                                        placeholder="Email" required>
                                </div>
                                <div class="form-group" id="mob">
                                    <label for="donation_profile_mobno">Mobile Number</label>
                                    <input type="text" class="form-control" id="donation_profile_mobno"
                                        pattern="[9876][0-9]{9}" name="phone" placeholder="Mobile Number" required
                                        maxlength="10">
                                </div>
                                <div class='form-group'>

                                    <label class='control-label'>Card Number</label>
                                    <input autocomplete='off' class='form-control card-number' maxlength="16" pattern="[0-9]+" minlength="16" name="cardno"
                                        type='text'>

                                </div>
                                <div class='form-row'>
                                    <div class='col-xs-4 form-group cvc required'>
                                        <label class='control-label'>CVV</label>
                                        <input autocomplete='off' class='form-control card-cvc' name="cvv"
                                            placeholder='ex. 311' size='4' pattern="[0-9]+" minlength="3" maxlength="3" type='text' required>
                                    </div>
                                    <div class='col-xs-4 form-group expiration required'>
                                        <label class='control-label'>Expiration</label>
                                        <input class='form-control card-expiry-month' name="month" maxlength="2" minlength="2" placeholder='MM' required
                                            size='2' type='text'>
                                    </div>
                                    <div class='col-xs-4 form-group expiration required'>
                                        <label class='control-label'>Date</label>
                                        <input class='form-control card-expiry-year' maxlength="4" minlength="4" required name="year" placeholder='YYYY'
                                            size='4' type='text'>
                                    </div>
                                </div>
                                <div class="form-group" id="amt">
                                    <label for="donation_amount">Donation Amount in INR</label>
                                    <input min="1" type="number" pattern="[0-9]+" class="form-control" id="donation_amount" name="amount"
                                        placeholder="Amount in INR" required>
                                </div>
                                <input style="width:40%;float: right;margin-right: 44px;" min="1" type="hidden"
                                    class="form-control" id="captcha" name="captcha" placeholder="Captcha" value="0">
                                <div class="form-group" id="check">
                                </div>
                                <input type="hidden" value="ok" id="OrderId" name="OrderId">
                                <center><button type="submit" id="submit" name="submit"
                                        class="btn btn-lg btn-primary ">PROCEED</button> <br>
                                   <a href="/index" style="all: unset; margin-top: 25px;font-size: 20px;"> 
                                        Back</a>
                                </center>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-xs-12 col-sm-4">

                </div>
            </div>
        </div>
        <!-- </div> -->
    </section>
