{% extends 'admin/adminbase.html' %}
{% block header %}

<style>
    /* #selection
{
	margin:0 auto;
	padding:10px;
	-moz-border-radius:.3em;

	-o-border-radius:.3em;

body{
    overflow-x: hidden;
}
    #selection select {
        width: 99%;
        background: #fff;
        border: #ddd 1px solid;
        border-radius: .35em;
        -moz-border-radius: .35em;
        -webkit-border-radius: .35em;
        -o-border-radius: .35em;
        padding: 0 .5%;
        margin-top: 5px;
        margin-bottom: 15px;
        height: 35px;
    }

    #selection select:hover {
        box-shadow: #dae1e5 0px 0px 5px;
        -moz-box-shadow: #dae1e5 0px 0px 5px;
        -webkit-box-shadow: #dae1e5 0px 0px 5px;
        -o-box-shadow: #dae1e5 0px 0px 5px;
    }

    #selection select:focus {
        -webkit-box-shadow: inset 7px 4px 7px -7px rgba(0, 0, 0, 0.42);
        -moz-box-shadow: inset 7px 4px 7px -7px rgba(0, 0, 0, 0.42);
        box-shadow: inset 7px 4px 7px -7px rgba(0, 0, 0, 0.42);

        border: #9d9983 1px solid;
    }

    .resp_code {
        margin: 5px 10px 10px 300px;
        padding: 10px 20px 10px 20px;
        color: #333;
        background: #f8f8f8;
        overflow: auto;
        width: 50%;
    }

    h5 {
        margin: 0;
        padding: 0;
    }

    @media screen and (max-width: 480px) {
        .resp_code {
            width: auto !important;
            margin: 0px !important;
        }
    }
</style>
<div class="inner-banner">
    <section class="w3l-breadcrumb py-5">
        <div class="container py-lg-5 py-md-3">
            <h2 class="title">Allot Fund</h2>
        </div>
    </section>
  </div>
  <!-- banner bottom shape -->
  <div class="position-relative">
    <div class="shape overflow-hidden">
        <svg viewBox="0 0 2880 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 48H1437.5H2880V0H2160C1442.5 52 720 0 720 0H0V48Z" fill="currentColor"></path>
        </svg>
    </div>
  </div>
  <!-- banner bottom shape -->
<section class="w3l-contact-7 py-5" id="contact">
    <div class="contacts-9 py-lg-5 py-md-4">
        <div class="container" style="margin-left: 300px;">
            {% for i in cdata %}
            <div class="top-map">
                <div class="row map-content-9">
                    <div class="col-lg-8">
                        <form action="" method="post" class="text-center">
                            {% csrf_token %}
                            <div class="form-grid">
                                <input type="text" name="name" id="w3lSender" value="{{i.fname}} {{i.lname}}" readonly pattern="[a-z A-Z]+" placeholder="Name*"
                                    required="">
                                <input type="email" name="email" value="{{i.email}}" readonly id="w3lSender"
                                    pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$" placeholder="Email*"
                                    required="">
                                
                                <input type="text" readonly value="{{i.bankname}}" name="bankname" id="w3lSender" pattern="[a-z A-Z]+" placeholder="Name of the Bank*"
                                    required="">
                                <input type="text" readonly value="{{i.aadhaar}}" name="aadhaar" id="w3lSender" pattern="[a-z A-Z]+" placeholder="Aadhaar Number*"
                                    required="">
                                <input type="text" readonly name="accno" value="{{i.accno}}" id="w3lSender" pattern="[0-9]+" placeholder="Account Number*"
                                    required="">
                                <input type="text" readonly value="{{i.ifsc}}" name="ifsc" id="w3lSender" pattern="[A-Z 0-9]+" placeholder="IFSC Code*"
                                    required="">
                                <input type="text" readonly name="branch" value="{{i.branch}}" id="w3lSender" pattern="[a-z A-Z]+" placeholder="Branch*"
                                    required="">
                                <input type="text" name="amount" id="w3lSender"
                                    placeholder="Sanctioned Amount*" maxlength="10" pattern="[0-9]+" required="">
                                <!-- <textarea name="address" id="" cols="30" rows="5" placeholder="Address*" style="width: 205%;margin-top: -10px;"></textarea> -->
                                <div id="dumdiv" align="center" style="display: none; font-size: 10px;color: #dadada;">
                                    <a id="dum"
                                        style="padding-right:0px;display: none; text-decoration:none;color: green;text-align:center;"
                                        href="http://www.hscripts.com">&copy;h</a>
                                </div>
                            </div>  
                            <button type="submit" class="btn btn-primary btn-style mt-3">Allot Fund</button>
                        </form>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>

{% endblock %}
