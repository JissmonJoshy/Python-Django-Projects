{% extends 'base.html' %}
{% load static %}
{% block content %}

{% for m in messages %}
<script>
    alert("{{ m }}")
</script>
{% endfor %}

<div class="contact-us-form"> 
    <div class="container">
        <div class="row align-items-center">
            <div class="col-lg-6">
                <!-- Contact Us Image Start -->
                <div class="contact-us-img">
                    <figure class="reveal image-anime">
                        <img src="{% static 'images/contact-us-img.jpg' %}" alt="">
                    </figure>
                </div>
                <!-- Contact Us Image End -->
            </div>
            <div class="col-lg-6">
                <div class="contact-form">
                    <!-- Section Title Start -->
                    <div class="section-title">
                        <h3 class="wow fadeInUp">Patient Registration</h3>
                        <h2 class="text-anime-style-2" data-cursor="-opaque"><span>Join</span> Us</h2>
                    </div>
                    <!-- Section Title End -->
                    
                    <form id="registerForm" action="{% url 'patient_register' %}" method="POST" enctype="multipart/form-data" class="wow fadeInUp" data-wow-delay="0.25s" onsubmit="return showSuccessMessage()">
                        {% csrf_token %}
                        
                        <div class="row">
                            <div class="form-group col-md-12 mb-4">
                                <input type="text" name="username" class="form-control" placeholder="Enter Username" required>
                            </div>
                    
                            <div class="form-group col-md-12 mb-4">
                                <input type="text" name="name" class="form-control" placeholder="Enter Full Name" required>
                            </div>
                    
                            <div class="form-group col-md-12 mb-4">
                                <input type="email" name="email" class="form-control" placeholder="Enter Email" required>
                            </div>
                    
                            <div class="form-group col-md-12 mb-4">
                                <input type="text" name="phone" class="form-control" placeholder="Enter Phone Number" required pattern="[0-9]{10}" title="Phone number must be exactly 10 digits" maxlength=10>
                            </div>
                    
                            <div class="form-group col-md-12 mb-4">
                                <textarea name="address" class="form-control" placeholder="Enter Address" rows="3" required></textarea>
                            </div>
                            
                            <div class="form-group col-md-12 mb-4">
                                <input type="text" name="state" class="form-control" placeholder="Enter State" required>
                            </div>
                            
                            <div class="form-group col-md-12 mb-4">
                                <input type="text" name="district" class="form-control" placeholder="Enter District" required>
                            </div>
                            
                            <div class="form-group col-md-12 mb-4">
                                <input type="text" name="pincode" class="form-control" placeholder="Enter Pincode" required pattern="[0-9]{6}" title="Pincode must be exactly 6 digits" maxlength="6">
                            </div>

                            <div class="form-group col-md-12 mb-4">
                                <input type="password" name="password" class="form-control" placeholder="Enter Password" required 
                                       pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" 
                                       title="Password must be at least 8 characters long and contain at least one number, one uppercase, and one lowercase letter">
                            </div>
                    
                            <div class="form-group col-md-12 mb-4">
                                <input type="file" name="image" class="form-control" required>
                            </div>
                    
                            <div class="col-md-12">
                                <button type="submit" class="btn-default">Register</button>
                            </div>
                        </div>
                    </form>
                    
                </div>
            </div>
        </div>
    </div>
</div>


{% endblock %}
