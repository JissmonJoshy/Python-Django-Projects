{% extends 'patient/patient_base.html' %}

{% block content %}

{% for m in messages %}
<script>
    alert("{{ m }}")
</script>
{% endfor %}

<!-- leave_review.html -->
<main class="container mt-5">
    <h2 class="text-center mb-4">Leave a Review</h2>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="rating">Rating</label>
            <select name="rating" class="form-control" id="rating" required>
                <option value="1">1 Star</option>
                <option value="2">2 Stars</option>
                <option value="3">3 Stars</option>
                <option value="4">4 Stars</option>
                <option value="5">5 Stars</option>
            </select>
        </div>
        <div class="form-group mt-3">
            <label for="comment">Your Feedback</label>
            <textarea name="comment" class="form-control" id="comment" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Submit Review</button>
    </form>
</main>

{% endblock %}
