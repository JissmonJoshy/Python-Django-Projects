{% extends 'admin/admin_base.html' %}

{% block content %}
<main class="container mt-5 d-flex justify-content-center">
    <div class="card shadow-lg p-4 rounded" style="max-width: 600px; width: 100%; background-color: #f8f9fa;">
        <h2 class="text-center text-primary mb-4">📅 Schedule Appointment</h2>

        {% if messages %}
        <div class="mt-2">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label for="appointment_id" class="form-label fw-bold">🦷 Select Approved Appointment:</label>
                <select name="appointment_id" class="form-select shadow-sm" required>
                    <option value="">-- Select an Appointment --</option>
                    {% for appointment in approved_appointments %}
                    <option value="{{ appointment.id }}">
                        {{ appointment.patient.name }} - {{ appointment.dentist.name }} 
                        ({{ appointment.schedule.date }} | {{ appointment.schedule.start_time }} - {{ appointment.schedule.end_time }})
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="start_time" class="form-label fw-bold">⏰ Select Start Time:</label>
                <input type="time" name="start_time" class="form-control shadow-sm" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 shadow-sm">✅ Schedule Appointment</button>
        </form>
    </div>
</main><br><br>

<style>
    body {
        background: linear-gradient(to right, #6dd5ed, #2193b0);
    }
    .card {
        animation: fadeIn 0.6s ease-in-out;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    select:hover, input:hover {
        border: 2px solid #2193b0 !important;
        transition: 0.3s;
    }
</style>

{% endblock %}
