{% extends 'base.html' %}
{% load static %}
{% block content %}

{% for m in messages %}
<script>
    alert("{{ m }}")
</script>
{% endfor %}

<div class="contact-us-form"> 
    <div class="container">
        <div class="row align-items-center">
            <div class="col-lg-6">
                <!-- Contact Us Image Start -->
                <div class="contact-us-img">
                    <figure class="reveal image-anime">
                        <img src="{% static 'images/contact-us-img.jpg' %}" alt="">
                    </figure>
                </div>
                <!-- Contact Us Image End -->
            </div>
            <div class="col-lg-6">
                <div class="contact-form">
                    <!-- Section Title Start -->
                    <div class="section-title">
                        <h3 class="wow fadeInUp">Login</h3>
                        <h2 class="text-anime-style-2" data-cursor="-opaque"><span>Welcome</span> Back</h2>
                    </div>
                    <!-- Section Title End -->

                    <!-- Display Messages -->
                    
                    
                    <form id="loginForm" action="{% url 'view_login' %}" method="POST" class="wow fadeInUp" data-wow-delay="0.25s">
                        {% csrf_token %}
                        
                        <div class="row">
                            <div class="form-group col-md-12 mb-4">
                                <input type="text" name="username" class="form-control" placeholder="Enter Username" required>
                            </div>
                            
                            <div class="form-group col-md-12 mb-4">
                                <input type="password" name="password" class="form-control" placeholder="Enter Password" required>
                            </div>
                            
                            <div class="col-md-12">
                                <button type="submit" class="btn-default">Login</button>
                            </div>
                        </div>
                    </form>
                    
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
