{% extends 'base.html' %}
{% load static %}
{% block content %}
<br>
<main class="login-container">
    <div class="login-box">
        <h2>Login</h2>
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="{{ message.tags }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
        <form method="POST" action="">
            {% csrf_token %}
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        
        <p>Don't have an account?  
            <a href="{% url 'ngo_register' %}">Register as NGO</a> |  
            <a href="{% url 'donor_register' %}">Register as Donor</a>
        </p>
    </div>
</main>

<style>
    
    .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-image: url('{% static "assets/images/backgrounds/banner-one-map-1.png" %}');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }
    .login-box {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 350px;
        text-align: center;
    }
    .input-group {
        margin-bottom: 15px;
        text-align: left;
    }
    .input-group label {
        display: block;
        font-weight: bold;
    }
    .input-group input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    button {
        width: 100%;
        padding: 10px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    button:hover {
        background: #0056b3;
    }
    .messages {
        color: red;
        margin-bottom: 10px;
    }
</style>

{% endblock %}
