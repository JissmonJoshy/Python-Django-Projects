{% extends 'donor/donor_base.html' %}

{% block content %}
<br><br><br>
<main class="container mt-5">
    <h2 class="text-center mb-4">Edit Donor Profile</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card p-4">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" name="username" class="form-control" id="username" value="{{ donor_profile.username }}" required>
                    </div>
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" name="name" class="form-control" id="name" value="{{ donor_profile.name }}" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" name="email" class="form-control" id="email" value="{{ donor_profile.email }}" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="text" name="phone" class="form-control" id="phone" value="{{ donor_profile.phone }}" required>
                    </div>
                    <div class="form-group">
                        <label for="address">Address</label>
                        <textarea name="address" class="form-control" id="address" rows="3" required>{{ donor_profile.address }}</textarea>
                    </div>
                    <div class="form-group">
                        <label for="image">Profile Image</label>
                        <input type="file" name="image" class="form-control" id="image">
                        {% if donor_profile.image %}
                            <div class="text-center mt-2">
                                <img src="{{ donor_profile.image.url }}" alt="Profile Image" class="img-thumbnail" style="max-width: 150px;"/>
                            </div>
                        {% else %}
                            <p class="text-center mt-2">No image available</p>
                        {% endif %}
                    </div>
                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-success w-50">Save Changes</button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</main>
<br><br>
{% endblock %}
