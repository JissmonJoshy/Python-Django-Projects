
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a Donation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        #monetary_fields, #card_fields {
            display: none;
        }
    </style>
</head>
<body>
    <main class="container mt-5">
        <h2 class="text-center mb-4">Make a Donation</h2>
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8 col-sm-12">
                <div class="card p-4">
                    <h4>{{ donation.title }}</h4>
                    <p><strong>Category:</strong> {{ donation.category }}</p>
                    <p><strong>Description:</strong> {{ donation.description }}</p>
                    <p><strong>Target Amount:</strong> ₹{{ donation.target_amount }}</p>
                    <p><strong>Current Amount:</strong> ₹{{ donation.current_amount }}</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-group">
                            <label>Select Donation Type</label>
                            <select name="donation_type" id="donation_type" class="form-control" required onchange="togglePayment()">
                                <option value="">Select</option>
                                <option value="Monetary">Monetary</option>
                                <option value="Food">Food</option>
                                <option value="Clothing">Clothing</option>
                                <option value="Medical Supplies">Medical Supplies</option>
                                <option value="Others">Others</option>
                            </select>
                        </div>
                        <div id="monetary_fields">
                            <div class="form-group">
                                <label>Amount</label>
                                <input type="number" name="amount" id="amount" class="form-control" placeholder="Enter amount" required>
                            </div>
                            <div class="form-group">
                                <label>Select Payment Method</label>
                                <select name="payment_method" id="payment_method" class="form-control" onchange="toggleCardFields()">
                                    <option value="">--Select Payment Method--</option>
                                    <option value="upi">UPI</option>
                                    <option value="netbanking">Net Banking</option>
                                    <option value="card">Credit/Debit Card</option>
                                </select>
                            </div>
                            <div id="card_fields">
                                <div class="form-group">
                                    <label>Card Number</label>
                                    <input type="text" name="card_number" id="card_number" class="form-control" placeholder="1234 5678 9012 3456" pattern="\d{16}">
                                </div>
                                <div class="form-group">
                                    <label>Cardholder Name</label>
                                    <input type="text" name="card_holder" id="card_holder" class="form-control" placeholder="Cardholder Name">
                                </div>
                                <div class="row">
                                    <div class="col">
                                        <label>Expiration Date</label>
                                        <input type="month" name="expiry_date" id="expiry_date" class="form-control">
                                    </div>
                                    <div class="col">
                                        <label>CVV</label>
                                        <input type="password" name="cvv" id="cvv" class="form-control" placeholder="***" pattern="\d{3}">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-success w-100 mt-3">Donate</button>
                        </div>
                        <div class="text-center mt-3">
                            <a href="{% url 'display_all_donations' %}" class="btn btn-secondary w-100">Cancel Transaction</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script>
        function togglePayment() {
            var donationType = document.getElementById('donation_type').value;
            var monetaryFields = document.getElementById('monetary_fields');
            var amountInput = document.getElementById('amount');
            var paymentMethod = document.getElementById('payment_method');
            
            if (donationType === 'Monetary') {
                monetaryFields.style.display = 'block';
                amountInput.setAttribute('required', 'true');
                paymentMethod.setAttribute('required', 'true');
            } else {
                monetaryFields.style.display = 'none';
                amountInput.removeAttribute('required');
                paymentMethod.removeAttribute('required');
            }
        }
        function toggleCardFields() {
            var paymentMethod = document.getElementById('payment_method').value;
            var cardFields = document.getElementById('card_fields');
            cardFields.style.display = (paymentMethod === 'card') ? 'block' : 'none';
        }
        document.addEventListener("DOMContentLoaded", function() {
            document.querySelector("form").addEventListener("submit", function(event) {
                var paymentMethod = document.getElementById("payment_method").value;
                if (paymentMethod === "card") {
                    var cardNumber = document.getElementById("card_number").value;
                    var cardHolder = document.getElementById("card_holder").value.trim();
                    var expiryDate = document.getElementById("expiry_date").value;
                    var cvv = document.getElementById("cvv").value;
                    var cardNumberRegex = /^\d{16}$/; 
                    var cvvRegex = /^\d{3}$/;
                    if (!cardNumberRegex.test(cardNumber)) {
                        alert("Invalid Card Number. Must be 16 digits.");
                        event.preventDefault();
                        return;
                    }
                    if (cardHolder === "") {
                        alert("Cardholder Name is required.");
                        event.preventDefault();
                        return;
                    }
                    if (!cvvRegex.test(cvv)) {
                        alert("Invalid CVV. Must be 3 digits.");
                        event.preventDefault();
                        return;
                    }
                    if (!validateExpiryDate(expiryDate)) {
                        alert("Invalid Expiry Date. Must be a future date.");
                        event.preventDefault();
                        return;
                    }
                }
            });
        });
        function validateExpiryDate(expiryDate) {
            var today = new Date();
            var inputDate = new Date(expiryDate + "-01"); 
            return inputDate > today;
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
