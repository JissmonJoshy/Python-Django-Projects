{% extends 'donor/donor_base.html' %}

{% block content %}
<br><br><br>
<main class="container mt-5">
    <h2 class="text-center mb-4">Donor Profile</h2>

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card p-4">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" name="username" class="form-control" id="username" value="{{ donor_profile.username }}" disabled>
                </div>
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" name="name" class="form-control" id="name" value="{{ donor_profile.name }}" disabled>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" name="email" class="form-control" id="email" value="{{ donor_profile.email }}" disabled>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" name="phone" class="form-control" id="phone" value="{{ donor_profile.phone }}" disabled>
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea name="address" class="form-control" id="address" rows="3" disabled>{{ donor_profile.address }}</textarea>
                </div>
                <div class="form-group">
                    <label for="image">Profile Image</label>
                    {% if donor_profile.image %}
                        <div class="text-center">
                            <img src="{{ donor_profile.image.url }}" alt="Profile Image" class="img-thumbnail" style="max-width: 150px;"/>
                        </div>
                    {% else %}
                        <p class="text-center">No image available</p>
                    {% endif %}
                </div>
                <div class="text-center mt-4">
                    <a href="{% url 'edit_profile_donor' %}" class="btn btn-warning w-50">Edit Profile</a>
                </div>
            </div>
        </div>
    </div>
</main>
<br><br>
{% endblock %}
