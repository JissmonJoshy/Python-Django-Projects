{% extends 'farmer/common.html' %}

{% load static %}
{% block content %}


{% for m in messages %}
<script>
    alert("{{m}}")
</script>
{% endfor %}


<div class="container mt-5">
    <h3 class="text-center mb-4">Add Product</h3>
    <form method="POST" enctype="multipart/form-data" class="w-50 mx-auto p-4 shadow rounded" style="background: #f9f9f9;">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Product Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Price</label>
            <input type="number" name="price" step="0.01" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Quantity(in Kg)</label>
            <input type="number" name="quantity" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Image</label>
            <input type="file" name="image" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Add Product</button>
    </form>
</div>

<br><br><br><br><br><br><br>
<br><br><br><br><br><br><br>
{% endblock %}
