{% extends 'farmer/common.html' %}

{% block content %}

{% for m in messages %}
<script>
    alert("{{m}}")
</script>
{% endfor %}
 
<div class="container mt-5">
    <h2 class="text-center mb-4">Edit Profile</h2>
    <form method="POST" enctype="multipart/form-data" class="mx-auto" style="max-width: 600px;">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" value="{{ farmer.name }}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" value="{{ farmer.username }}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" value="{{ farmer.email }}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="number" name="phone" value="{{ farmer.phone }}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea name="address" class="form-control" required>{{ farmer.address }}</textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Image</label>
            {% if farmer.image %}
                <br><img src="{{ farmer.image.url }}" width="100" height="100" style="object-fit: cover;" class="mb-2"><br>
            {% endif %}
            <input type="file" name="image" class="form-control">
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-primary">Update Profile</button>
        </div>
    </form>
</div>

<br><br><br><br><br>
<br><br><br><br><br><br><br><br><br>
{% endblock %}
