{% extends 'farmer/common.html' %}

{% load static %}
{% block content %}


{% for m in messages %}
<script>
    alert("{{m}}")
</script>
{% endfor %}



<div class="container mt-5" style="max-width: 600px;">
    <h3 class="text-center mb-4">Edit Product</h3>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Product Name</label>
            <input type="text" name="name" value="{{ product.name }}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3" required>{{ product.description }}</textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Price</label>
            <input type="number" name="price" value="{{ product.price }}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Quantity</label>
            <input type="number" name="quantity" value="{{ product.quantity }}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Image</label><br>
            {% if product.image %}
                <img src="{{ product.image.url }}" width="100" height="100" class="mb-2" style="object-fit: cover;"><br>
            {% endif %}
            <input type="file" name="image" class="form-control">
        </div>
        <div class="d-flex justify-content-between">
            <a href="{% url 'farmer_added_products' %}" class="btn btn-secondary">Back</a>
            <button type="submit" class="btn btn-success">Update Product</button>
        </div>
    </form>
</div>

<br><br><br><br><br><br><br>
<br><br><br><br><br><br><br>

{% endblock %}
