{% extends 'user/common.html' %}

{% load static %}
{% block content %}


{% for m in messages %}
<script>
    alert("{{m}}")
</script>
{% endfor %}



<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4 text-success">Checkout</h2>

                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Payment Method</label><br>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="payment_method" value="Card" required>
                                <label class="form-check-label">Card</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="payment_method" value="Home Delivery" required>
                                <label class="form-check-label">Home Delivery</label>
                            </div>
                        </div>

                        <div id="delivery-fields" style="display: none;">
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" name="delivery_name" class="form-control" placeholder="Enter Full Name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Phone</label>
                                <input type="text" name="delivery_phone" class="form-control" placeholder="Enter Phone Number" maxlength=10 required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Address</label>
                                <textarea name="delivery_address" class="form-control" placeholder="Enter Delivery Address" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">PIN Code</label>
                                <input type="text" name="delivery_pin" class="form-control" placeholder="Enter PIN Code" maxlength=6 required>
                            </div>
                        </div>
                        
                        <div id="card-fields" style="display: none;">
                            <div class="mb-3">
                                <label class="form-label">Card Holder Name</label>
                                <input type="text" name="card_holder" class="form-control" placeholder="Enter Card Holder Name">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Card Number</label>
                                <input type="text" name="card_number" maxlength="16" class="form-control" placeholder="Enter Card Number">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Expiry Date (MM/YY)</label>
                                <input type="text" name="expiry_date" class="form-control" placeholder="MM/YY">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">CVV</label>
                                <input type="text" name="cvv" maxlength="4" class="form-control" placeholder="CVV">
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg mt-3">Place Order</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    const paymentOptions = document.querySelectorAll('input[name="payment_method"]');
    const cardFields = document.getElementById('card-fields');
    const deliveryFields = document.getElementById('delivery-fields');

    paymentOptions.forEach(option => {
        option.addEventListener('change', function () {
            if (this.value === 'Card') {
                cardFields.style.display = 'block';
                deliveryFields.style.display = 'none';
                // Add required to card fields
                cardFields.querySelectorAll('input').forEach(field => {
                    field.required = true;
                });
                // Remove required from delivery fields
                deliveryFields.querySelectorAll('input, textarea').forEach(field => {
                    field.required = false;
                });
            } else {
                cardFields.style.display = 'none';
                deliveryFields.style.display = 'block';
                // Remove required from card fields
                cardFields.querySelectorAll('input').forEach(field => {
                    field.required = false;
                });
                // Add required to delivery fields
                deliveryFields.querySelectorAll('input, textarea').forEach(field => {
                    field.required = true;
                });
            }
        });
    });
</script>



<br><br><br><br><br><br>
<br><br><br><br>

{% endblock %}
