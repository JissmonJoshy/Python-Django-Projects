{% extends "common.html" %}

{% load static %}
{% block content %}

<!-- Display messages using an alert -->
{% for m in messages %}
    <script>
        alert("{{ m }}");
    </script>
{% endfor %}



<section class="contact-section contact_pg_contact">
    <div class="container">
        <div class="base-header">
            <h3>Farmer Register</h3> 
        </div>
        <div class="contact_wrp">
                <div class="col-md-8 col-sm-12 inner-contact" style="margin-left: 200px;">
                    <div class="contact-form">
                        <form method="post" action="{% url 'farmer_register' %}" enctype="multipart/form-data" id="contact-form">
                            {% csrf_token %}
                            <div class="row">
                                <!-- Name Field -->
                                <div class="col-lg-6 col-sm-12">
                                    <label for="name">Full Name</label>
                                    <input class="con-field" name="name" id="name" type="text" placeholder="Full Name" required>
                                </div>
                                
                                <!-- Username Field -->
                                <div class="col-lg-6 col-sm-12">
                                    <label for="username">Username</label>
                                    <input class="con-field" name="username" id="username" type="text" placeholder="Username" required>
                                </div>

                                <!-- Email Field -->
                                <div class="col-lg-6 col-sm-12">
                                    <label for="email">Email</label>
                                    <input class="con-field" name="email" id="email" type="email" placeholder="Email" required>
                                </div>

                                <!-- Phone Field -->
                                <div class="col-lg-6 col-sm-12">
                                    <label for="phone">Phone</label>
                                    <input class="con-field" name="phone" id="phone" type="text" placeholder="Phone" required>
                                </div>

                                <!-- Address Field -->
                                <div class="col-lg-12 col-sm-12">
                                    <label for="address">Address</label>
                                    <input class="con-field" name="address" id="address" type="text" placeholder="Address" required>
                                </div>

                                <!-- Password Field -->
                                <div class="col-lg-6 col-sm-12">
                                    <label for="password">Password</label>
                                    <input class="con-field" name="password" id="password" type="password" placeholder="Password" required>
                                </div>

                                <!-- Profile Image Field -->
                                <div class="col-lg-6 col-sm-12">
                                    <label for="image">Profile Image</label>
                                    <input class="con-field" name="image" id="image" type="file" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-lg-12 col-sm-12">
                                    <div class="submit-area">
                                        <input type="submit" class="submit-contact" value="Register">
                                        <div id="msg" class="message"></div>
                                    </div>
                                </div>
                            </div>
                        </form>
                </div>
            </div>
        </div>
    </div>
</section>

<br><br><br><br><br><br>

{% endblock %}
