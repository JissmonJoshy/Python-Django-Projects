{% extends "common.html" %}

{% block content %}
<main class="wrapper">
    <div class="wptb-page-heading" style="background-image: url('/static/assets/img/background/page-header-bg.jpg');">
        <div class="container">
            <div class="wptb-item--inner">
                <h2 class="wptb-item--title">Service Registration</h2>
                <ul class="wptb-breadcrumb">
                    <li><a href="/">Home</a></li>
                    
                    <li><span>Service Registration</span></li>
                </ul>
            </div>
        </div>
    </div>

    <section class="pd-bottom-300">
        <div class="container">
            <div class="wptb-login-form">
                <div class="wptb-form--wrapper">
                    <div class="row">
                        <div class="col-lg-8 col-md-10 offset-lg-2 offset-md-1">
                            <div class="wptb-heading">
                                <h1 class="wptb-item--title">Service Register</h1>
                            </div>

                            <!-- Display Messages -->
                            

                            <form method="POST" enctype="multipart/form-data">
                                {% csrf_token %}
                                <div class="wptb-form--inner">
                                    <div class="row">
                                        <div class="col-lg-12 mb-4">
                                            <input type="text" name="center_name" class="form-control" placeholder="Enter Service Center Name" required>
                                        </div>

                                        <div class="col-lg-12 mb-4">
                                            <input type="email" name="email" class="form-control" placeholder="Enter Email Address" required>
                                        </div>

                                        <div class="col-lg-12 mb-4">
                                            <input type="text" name="service_type" class="form-control" placeholder="Enter Service Type (e.g., Ambulance, Fire)" required>
                                        </div>

                                        <div class="col-lg-12 mb-4">
                                            <input type="text" name="phone_number" class="form-control" placeholder="Enter Phone Number" required>
                                        </div>

                                        <div class="col-lg-12 mb-4">
                                            <input type="text" name="address" class="form-control" placeholder="Enter Address" required>
                                        </div>

                                        <div class="col-lg-12 mb-4">
                                            <input type="file" name="image" class="form-control" required>
                                        </div>

                                        <div class="col-lg-12 mb-4">
                                            <input type="password" name="password" class="form-control" placeholder="Enter Password" required>
                                        </div>

                                        <div class="col-lg-12">
                                            <button class="btn-two white" type="submit">
                                                <span class="text-first">Register</span>
                                                <span class="text-second"><i class="bi bi-plus"></i></span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
{% endblock %}
