{% extends "employee/common.html" %}
{% load static %}

{% block content %}
<main>

<section class="section banner-inner">
    <div class="hero-container">
        <h1>Edit Employee Profile</h1>
    </div>
</section>

<section class="section">
    <div class="hero-container">
        <div class="row row-cols-xl-2 row-cols-1 grid-spacer-3">

            <!-- LEFT INFO -->
            <div class="col">
                <div class="d-flex flex-column gspace-2">
                    <h2>Update Your Info</h2>
                </div>
            </div>

            <!-- RIGHT FORM -->
            <div class="col">
                <div class="card card-appointment">

                    <form method="POST" enctype="multipart/form-data" class="form">
                        {% csrf_token %}

                        <input type="text" name="full_name" value="{{ employee.full_name }}" placeholder="Full Name" required>
                        <input type="email" name="email" value="{{ employee.email }}" placeholder="Email" required>
                        <input type="text" name="mobile" value="{{ employee.mobile }}" placeholder="Mobile Number" required>
                        <textarea name="address" rows="3" placeholder="Address" required>{{ employee.address }}</textarea>

                        <select name="operation" required>
                            <option value="">Select Operation</option>

                            <option value="Engine Modification"
                                {% if employee.operation == "Engine Modification" %}selected{% endif %}>
                                Engine Modification
                            </option>

                            <option value="Paint & Wrap"
                                {% if employee.operation == "Paint & Wrap" %}selected{% endif %}>
                                Paint & Wrap
                            </option>

                            <option value="Interior Customization"
                                {% if employee.operation == "Interior Customization" %}selected{% endif %}>
                                Interior Customization
                            </option>

                            <option value="Audio & Infotainment"
                                {% if employee.operation == "Audio & Infotainment" %}selected{% endif %}>
                                Audio & Infotainment
                            </option>

                            <option value="Lighting & Accessories"
                                {% if employee.operation == "Lighting & Accessories" %}selected{% endif %}>
                                Lighting & Accessories
                            </option>

                            <option value="Suspension & Wheels"
                                {% if employee.operation == "Suspension & Wheels" %}selected{% endif %}>
                                Suspension & Wheels
                            </option>
                        </select>


                        <input type="file" name="profile_image">
                        <button type="submit" class="btn btn-accent">Update</button>
                    </form>

                </div>
            </div>

        </div>
    </div>
</section>

</main>
{% endblock %}
