{% extends "common.html" %}
{% load static %}
{% block content %}

<main class="main">
    <div class="login-area py-120">
        <div class="container">
            <div class="col-md-5 mx-auto">
                <div class="login-form">
                    <div class="login-header text-center mb-3">
                        <h3>Create your account</h3>
                    </div>
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" name="fullname" class="form-control" placeholder="Your Name" required>
                        </div>
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" name="username" class="form-control" placeholder="Your Username" required>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" name="email" class="form-control" placeholder="Your Email" required>
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="text" name="phone" class="form-control" placeholder="Your Phone Number">
                        </div>
                        <div class="form-group">
                            <label>Address</label>
                            <textarea name="address" class="form-control" placeholder="Your Address"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Batch</label>
                            <select name="batch" class="form-control">
                                <option value="">Select Batch</option>
                                <option value="BCA">BCA</option>
                                <option value="BCOM">BCom</option>
                                <option value="BSC CS">BSc CS</option>
                                <option value="BA ENGLISH">BA English</option>
                                <option value="BBA">BBA</option>
                                <option value="BSC CHEMISTRY">BSc Chemistry</option>
                                <option value="BSC PHYSICS">BSc Physics</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Profile Picture</label>
                            <input type="file" name="profile_picture" class="form-control">
                        </div>
                        <div class="d-flex align-items-center mt-3">
                            <button type="submit" class="theme-btn">Register</button>
                        </div>
                    </form>
                    <div class="login-footer mt-2">
                        <p>Already have an account? <a href="{% url 'logins' %}">Login.</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

{% endblock %}
