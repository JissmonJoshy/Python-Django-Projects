{% extends "common.html" %}
{% load static %}
{% block content %}

<div class="search-popup">
    <button class="close-search"><span class="far fa-times"></span></button>
    <form>
        <div class="form-group">
            <input type="search" name="search-field" placeholder="Search Here..." required>
            <button type="submit"><i class="far fa-search"></i></button>
        </div>
    </form>
</div>

<main class="main">
    <div class="site-breadcrumb" style="background: url('{% static "assets/img/breadcrumb/01.jpg" %}')">
        <div class="container">
            <h2 class="breadcrumb-title">Verify OTP</h2>
            <ul class="breadcrumb-menu">
                <li><a href="/">Home</a></li>
                <li class="active">Verify OTP</li>
            </ul>
        </div>
    </div>

    <div class="login-area py-120">
        <div class="container">
            <div class="col-md-5 mx-auto">
                <div class="login-form">
                    <div class="login-header">
                        <img src="{% static "assets/img/logo/logo.png" %}" alt="">
                        <p>Enter the OTP sent to your email</p>
                    </div>
                    {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}
                    <form method="POST">
                        {% csrf_token %}
                        <div class="form-group">
                            <label>OTP Code</label>
                            <input type="text" name="otp" class="form-control" placeholder="Enter OTP" required>
                        </div>
                        <div class="d-flex align-items-center">
                            <button type="submit" class="theme-btn"><i class="far fa-check-circle"></i> Verify</button>
                        </div>
                    </form>
                    <div class="login-footer">
                        <p>Didn't get the code? <a href="#">Resend OTP</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
