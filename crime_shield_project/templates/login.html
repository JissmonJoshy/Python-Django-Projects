{% extends 'common.html' %}
{% load static %}
{% block content %}

{% for m in messages %}
<script>
    alert("{{m}}")
</script>
{% endfor %}

<!-- Page Heading Section Start -->	
<div class="pagehding-sec">
    <div class="pagehding-overlay"></div>		
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="page-heading">
                    <h1>Login</h1>
                    <ul>
                        <li><a href="">Home</a></li>
                        <li><a href="">Login</a></li>
                    </ul>						
                </div>					
            </div>				
        </div>
    </div>
</div><br><br>
<!-- Page Heading Section End -->	
<!-- Contact Page Section Start -->
<main class="d-flex justify-content-center align-items-center vh-100 bg-body-tertiary">
    <div class="container" style="max-width: 500px;">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <h2 class="text-center mb-4 text-primary fw-bold">User Login</h2>

              

                <form method="POST" action="{% url 'view_login' %}">
                    {% csrf_token %}

                    <div class="form-floating mb-4 position-relative">
                        <input type="text" name="username" class="form-control rounded-3 ps-5" id="username" placeholder="Username" required>
                        <label for="username">Username</label>
                        <i class="bi bi-person-fill position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary"></i>
                    </div>
                    
                    <div class="form-floating mb-4 position-relative">
                        <input type="password" name="password" class="form-control rounded-3 ps-5" id="password" placeholder="Password" required>
                        <label for="password">Password</label>
                        <i class="bi bi-lock-fill position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary"></i>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg rounded-3 shadow-sm">Login</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main><br>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


{% endblock %}
