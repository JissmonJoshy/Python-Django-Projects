{% extends 'user/common.html' %}

{% load static %}
{% block content %}

{% for m in messages %}
<script>
    alert("{{m}}")
</script>
{% endfor %}


<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow rounded-4">
                <div class="card-body p-4">
                    <h3 class="text-center text-primary fw-bold mb-4">Register Complaint</h3>

                   

                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="form-floating mb-3">
                            <input type="text" name="title" class="form-control" id="title" placeholder="Complaint Title" required>
                            <label for="title">Title</label>
                        </div>

                        <div class="form-floating mb-3">
                            <textarea name="description" class="form-control" placeholder="Describe your complaint here" id="description" style="height: 150px;" required></textarea>
                            <label for="description">Description</label>
                        </div>

                        <div class="form-floating mb-3">
                            <select name="department" class="form-select" id="department" required>
                                <option value="">-- Select Department --</option>
                                {% for dept in departments %}
                                    <option value="{{ dept.id }}">{{ dept.name }}</option>
                                {% endfor %}
                            </select>
                            <label for="department">Select Police Department</label>
                        </div>

                        <div class="mb-3">
                            <label for="file" class="form-label">Upload File (optional)</label>
                            <input type="file" name="file" class="form-control" id="file">
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg rounded-3">Submit Complaint</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<br><br>
{% endblock %}
