{% extends 'user/common.html' %}

{% load static %}
{% block content %}

{% for m in messages %}
<script>
    alert("{{m}}")
</script>
{% endfor %}


<main class="container py-4">
    <h2 class="text-center text-primary mb-4">Report a Crime</h2>

    <form method="POST" enctype="multipart/form-data" class="w-75 mx-auto border p-4 rounded bg-light">
        {% csrf_token %}
        
        <div class="mb-3">
            <label class="form-label">Crime Type:</label>
            <input type="text" name="crime_type" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Location:</label>
            <input type="text" name="location" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description:</label>
            <textarea name="description" class="form-control" rows="4" required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Upload Evidence (optional):</label>
            <input type="file" name="evidence" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Select Department:</label>
            <select name="department" class="form-select" required>
                <option value="">--Select Department--</option>
                {% for dept in departments %}
                    <option value="{{ dept.id }}">{{ dept.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-primary px-4">Submit Report</button>
        </div>
    </form>
</main>

{% endblock %}
