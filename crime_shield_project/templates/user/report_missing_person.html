{% extends 'user/common.html' %}

{% load static %}
{% block content %}

{% for m in messages %}
<script>
    alert("{{m}}")
</script>
{% endfor %}

<main class="container py-4">
    <h2 class="text-center text-primary mb-4">Report a Missing Person</h2>

    <form method="POST" enctype="multipart/form-data" class="row g-3">
        {% csrf_token %}
        <div class="col-md-6">
            <label class="form-label">Person Name</label>
            <input type="text" name="person_name" class="form-control" required>
        </div>
        <div class="col-md-3">
            <label class="form-label">Age</label>
            <input type="number" name="age" class="form-control" required>
        </div>
        <div class="col-md-3">
            <label class="form-label">Pincode</label>
            <input type="text" name="pincode" class="form-control" required>
        </div>
        <div class="col-md-12">
            <label class="form-label">Last Seen Location</label>
            <input type="text" name="last_seen_location" class="form-control" required>
        </div>
        <div class="col-md-12">
            <label class="form-label">Address</label>
            <textarea name="address" class="form-control" rows="2" required></textarea>
        </div>
        <div class="col-md-12">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3" required></textarea>
        </div>
        <div class="col-md-6">
            <label class="form-label">Select Police Department</label>
            <select name="department" class="form-select" required>
                <option value="">-- Select --</option>
                {% for dept in departments %}
                    <option value="{{ dept.id }}">{{ dept.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Photo</label>
            <input type="file" name="photo" class="form-control">
        </div>
        <div class="col-12 text-center">
            <button type="submit" class="btn btn-success">Submit Report</button>
        </div>
    </form>
</main>


<br><br>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
