{% extends 'police/common.html' %}

{% load static %}
{% block content %}

{% for m in messages %}
<script>
    alert("{{m}}")
</script>
{% endfor %}
<br><br>

<main class="container py-5">
    <h2 class="text-center text-primary mb-4">Add Case Report</h2>

    <form method="POST" enctype="multipart/form-data" class="shadow p-4 rounded-4 bg-light">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label fw-semibold">Complaint Title:</label>
            <input type="text" class="form-control" value="{{ complaint.title }}" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Report File:</label>
            <input type="file" class="form-control" name="report_file">
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Case Evidence:</label>
            <textarea name="case_evidence" class="form-control" rows="3" required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Description:</label>
            <textarea name="description" class="form-control" rows="4" required></textarea>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-success btn-lg">Submit Report</button>
        </div>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
