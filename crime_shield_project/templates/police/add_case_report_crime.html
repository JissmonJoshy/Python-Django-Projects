{% extends 'police/common.html' %}

{% load static %}
{% block content %}

{% for m in messages %}
<script>
    alert("{{m}}")
</script>
{% endfor %}
<br><br>


<main class="container py-4">
    <h2 class="text-center text-primary">Add Crime Case Report for {{ crime.crime_type }}</h2>

    <form method="POST" enctype="multipart/form-data" class="mt-4">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Case Evidence:</label>
            <textarea name="case_evidence" class="form-control" rows="4" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Description:</label>
            <textarea name="description" class="form-control" rows="4" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Upload Report File:</label>
            <input type="file" name="report_file" class="form-control">
        </div>
        <button type="submit" class="btn btn-success">Submit Report</button>
    </form>
</main>
<br><br>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
