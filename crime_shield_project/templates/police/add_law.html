{% extends 'police/common.html' %}

{% load static %}
{% block content %}

{% for m in messages %}
<script>
    alert("{{m}}")
</script>
{% endfor %}
<br><br>

<main class="d-flex justify-content-center align-items-center vh-100 bg-body-secondary">
    <div class="container" style="max-width: 600px;">
        <div class="card shadow-lg rounded-4 border-0">
            <div class="card-body p-5">
                <h3 class="text-center mb-4 text-success fw-bold">Add New Law</h3>

                <form method="POST" action="{% url 'add_law' %}">
                    {% csrf_token %}

                    <div class="form-floating mb-3">
                        <input type="text" name="title" class="form-control" id="title" placeholder="Law Title" required>
                        <label for="title">Law Title</label>
                    </div>

                    <div class="form-floating mb-4">
                        <textarea name="description" class="form-control" placeholder="Law Description" id="description" style="height: 150px;" required></textarea>
                        <label for="description">Law Description</label>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-success btn-lg rounded-3">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<br><br>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
