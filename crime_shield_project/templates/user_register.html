{% extends 'common.html' %}
{% load static %}
{% block content %}

{% for m in messages %}
<script>
    alert("{{m}}")
</script>
{% endfor %}

<!-- Page Heading Section Start -->	
<div class="pagehding-sec">
    <div class="pagehding-overlay"></div>		
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="page-heading">
                    <h1>Police Department Register</h1>
                    <ul>
                        <li><a href="">Home</a></li>
                        <li><a href="">Police Department Register</a></li>
                    </ul>						
                </div>					
            </div>				
        </div>
    </div>
</div><br><br>


<main class="d-flex justify-content-center align-items-center vh-100 bg-body-tertiary">
    <div class="container" style="max-width: 550px;">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <h2 class="text-center mb-4 text-primary fw-bold">User Registration</h2>

               

                <form method="POST" action="{% url 'user_register' %}" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
                        <label for="username">Username</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="name" name="name" placeholder="Full Name" required>
                        <label for="name">Full Name</label>
                    </div>

                    <div class="form-floating mb-3">
                        <textarea class="form-control" placeholder="Address" id="address" name="address" style="height: 80px;" required></textarea>
                        <label for="address">Address</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="phone" name="phone" placeholder="Phone Number" required>
                        <label for="phone">Phone</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="email" name="email" placeholder="Email" required>
                        <label for="email">Email</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                        <label for="password">Password</label>
                    </div>

                    <div class="mb-4">
                        <label for="image" class="form-label">Upload Image</label>
                        <input type="file" class="form-control" id="image" name="image" accept="image/*" required>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-success btn-lg rounded-3 shadow-sm">Register</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<br><br>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
