{% extends 'USER/common.html' %}
{% block content %}
{% load static %}

<div class="auction-details-section pt-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="tab-content">
          <div class="tab-pane fade show active" id="pills-home" role="tabpanel">
            <div class="describe-content">
              <div class="bid-list-area">
                <ul class="list-unstyled">
                  {% for i in data %}
                  <li class="d-flex align-items-center mb-4 p-3 border rounded shadow-sm">
                    <!-- Image Section -->
                    <div class="flex-shrink-0">
                      <img src="../static/assets/{{ i.image }}" alt="Worker Image" class="rounded" style="width: 150px; height: 150px; object-fit: cover;">
                    </div>
                    
                    <!-- Worker Details Section -->
                    <div class="flex-grow-1 ms-4">
                      <h5 class="text-capitalize mb-2">Name: {{ i.name }}</h5>
                      <p class="mb-1"><strong>Phone:</strong> {{ i.phone }}</p>
                      <p class="mb-1"><strong>Place:</strong> {{ i.place }}</p>
                      {% comment %} <p class="mb-1"><strong>Job Type:</strong> {{ i.job_type }}</p> {% endcomment %}

                        <!-- NEW BUTTON -->
                      <a href="{% url 'contractor_details' i.id %}" 
                        class="btn btn-primary btn-sm mt-2">
                        View Details
                      </a>
                      
                    </div>
                  </li>
                  {% endfor %}
                </ul>
              </div>
            </div> 
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
