{% extends 'contractor/common.html' %}
{% block content %}
<div class="container mt-5">
    <h2 class="text-primary">Assign a New Worker</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Select a New Worker</label>
            <select class="form-control" name="worker" required>
                {% for worker in available_workers %}
                <option value="{{ worker.id }}">{{ worker.name }} ({{ worker.job_type }})</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-success">Assign Worker</button>
    </form>
</div>
{% endblock %}
