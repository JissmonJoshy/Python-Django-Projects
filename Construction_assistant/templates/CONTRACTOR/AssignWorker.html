{% extends 'CONTRACTOR/common.html' %}
{% block content %}
{% load static %}

{% for message in messages %}
<script>alert('{{message}}')</script>
{% endfor %}

<div class="container mt-5">
  <div class="card p-4 shadow">

    <h3 class="text-success mb-4">Assign Workers</h3>

    <form method="POST">
      {% csrf_token %}

      <!-- MULTI SELECT -->
      <label>Select Workers:</label>
      <select name="worker" multiple class="form-control" style="height:200px;">
        {% for worker in workers %}
          <option value="{{ worker.id }}">
            {{ worker.name }} - {{ worker.job_type }} ({{worker.experience}})
          </option>
        {% endfor %}
      </select>

      <small class="text-muted">Hold CTRL to select multiple</small>

      <br><br>

      <!-- AMOUNT -->
      <label>Enter Amount:</label>
      <input type="number" name="amount" class="form-control" required>

      <br>

      <button type="submit" class="btn btn-success">Assign Workers</button>
    </form>

  </div>
</div>

{% endblock %}
