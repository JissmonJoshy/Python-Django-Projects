{% extends 'CONTRACTOR/common.html' %}
{% block content %}
{% load static %}

<div class="page-content">

    <!-- Our Team Start --> 
    <section class="section-md">
        <div class="container">
            <div class="row">
                {% for i in data %}
                <div class="col-md-6 col-lg-3 mb-4 d-flex align-items-stretch">
                    <div class="card shadow-sm">
                        <img src="../static/assets/{{ i.image }}" class="card-img-top img-fluid" alt="User Image">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">Name: {{ i.name }}</h5>
                            <p class="card-text">Email: {{ i.email }}</p>
                            <p class="card-text">Place: {{ i.place }}</p>
                            <p class="card-text">Phone: {{ i.phone }}</p>
                            <a href="/updateContractor?id={{ i.id }}" class="btn btn-outline-success w-100">Update</a>
                            {% comment %} <div class="mt-auto">
                                <a href="/deleteUser?id={{ i.loginId.id }}" class="btn btn-outline-danger w-100">Reject</a>
                            </div> {% endcomment %}
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </section>
    <!-- Our Team End --> 

</div>
{% endblock %}
