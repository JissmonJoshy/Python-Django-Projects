{% extends 'common/usercommon.html' %}

{% load static %} 
{% block content %}
{% for m in messages %}
<script>
alert('{{m}}')
</script>
    {% endfor %}
<div class="container mt-5">
    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white text-center">
            <h2>Passport Application</h2>
        </div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data" onsubmit="return validateForm();">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-6">

                         <div class="mb-3">
                            <label class="form-label fw-bold">Name:</label>
                            <input type="text" pattern="[A-Za-z]+" class="form-control" placeholder="Enter Name" name="name" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Father's Name:</label>
                            <input type="text" pattern="[A-Za-z]+" class="form-control" placeholder="Enter Father's Name" name="father" required>
                        </div>

                        <div class="mb-3">
    <label class="form-label fw-bold">Father Email:</label>
    <input type="email" class="form-control" name="father_email" placeholder="Enter Father's Email" required>
</div>

<div class="mb-3">
    <label class="form-label fw-bold">Father Phone:</label>
    <input type="tel" pattern="[6-9][0-9]{9}" class="form-control" maxlength="10" name="father_phone" placeholder="Enter 10-digit Phone Number" required>
</div>

<div class="mb-3">
    <label class="form-label fw-bold">Father Address:</label>
    <textarea class="form-control" name="father_address" placeholder="Enter Father's Address" required></textarea>
</div>

<div class="mb-3">
    <label class="form-label fw-bold">Father Proof:</label>
    <input type="file" class="form-control" name="father_proof" required>
</div>


                        <div class="mb-3">
                            <label class="form-label fw-bold">Mother's Name:</label>
                            <input type="text" pattern="[A-Za-z]+" class="form-control" placeholder="Enter Mother's Name" name="mother" required>
                        </div>

                        <div class="mb-3">
    <label class="form-label fw-bold">Mother Email:</label>
    <input type="email" class="form-control" name="mother_email" placeholder="Enter Mother's Email" required>
</div>

<div class="mb-3">
    <label class="form-label fw-bold">Mother Phone:</label>
    <input type="tel" pattern="[6-9][0-9]{9}" maxlength="10" class="form-control" name="mother_phone" placeholder="Enter 10-digit Phone Number" required>
</div>

<div class="mb-3">
    <label class="form-label fw-bold">Mother Address:</label>
    <textarea class="form-control" name="mother_address" placeholder="Enter Mother's Address" required></textarea>
</div>

<div class="mb-3">
    <label class="form-label fw-bold">Mother Proof:</label>
    <input type="file" class="form-control" name="mother_proof" required>
</div>

                        
                    </div>

                    <div class="col-md-6">

                        <div class="mb-3">
                            <label class="form-label fw-bold">Gender:</label><br>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" value="male" required>
                                <label class="form-check-label">Male</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" value="female">
                                <label class="form-check-label">Female</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" value="others">
                                <label class="form-check-label">Others</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Marital Status:</label><br>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="martial" value="unmarried" required>
                                <label class="form-check-label">Unmarried</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="martial" value="married">
                                <label class="form-check-label">Married</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Date of Birth:</label>
                            <input type="date" class="form-control" name="dob" id="dob" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Place of Birth:</label>
                            <input type="text" class="form-control" placeholder="Enter Place of Birth" name="place" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Blood Group:</label>
                            <select class="form-select" name="blood" required>
                                <option value="" disabled selected>Select</option>
                                <option value="A+">A+</option>
                                <option value="B+">B+</option>
                                <option value="AB+">AB+</option>
                                <option value="O+">O+</option>
                                <option value="A-">A-</option>
                                <option value="B-">B-</option>
                                <option value="AB-">AB-</option>
                                <option value="O-">O-</option>
                            </select>
                        </div>




                        <div class="mb-3">
                            <label class="form-label fw-bold">District:</label>
                            <select class="form-select" name="district" required>
                                <option value="Alappuzha">Alappuzha</option>
                                <option value="Ernakulam">Ernakulam</option>
                                <option value="Idukki">Idukki</option>
                                <option value="Kannur">Kannur</option>
                                <option value="Kasaragod">Kasaragod</option>
                                <option value="Kollam">Kollam</option>
                                <option value="Kottayam">Kottayam</option>
                                <option value="Kozhikode">Kozhikode</option>
                                <option value="Malappuram">Malappuram</option>
                                <option value="Palakkad">Palakkad</option>
                                <option value="Pathanamthitta">Pathanamthitta</option>
                                <option value="Thiruvananthapuram">Thiruvananthapuram</option>
                                <option value="Thrissur">Thrissur</option>
                                <option value="Wayanad">Wayanad</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Address:</label>
                            <textarea class="form-control" placeholder="Enter Postal Address" name="address" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Identification Proof:</label>
                            <select class="form-select" name="identification" required>
                                <option value="aadhar">Aadhar Card</option>
                                <option value="voters_id">Voter's ID</option>
                                <option value="driving_license">Driving License</option>
                                <option value="pan_card">PAN Card</option>
                                <option value="passport">Passport</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Upload ID Proof:</label>
                            <input type="file" class="form-control" name="idproof" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Upload Passport-sized Photo:</label>
                            <input type="file" class="form-control" name="photo" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Upload Address Proof:</label>
                            <input type="file" class="form-control" name="addressproof" required>
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" name="declaration" required>
                                <label class="form-check-label fw-bold">I declare that the information provided is true and accurate.</label>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="text-center">
                    <button type="submit" class="btn btn-success btn-lg">Submit Application</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function validateForm() {
        var dobInput = document.getElementById('dob');
        var dob = new Date(dobInput.value);
        var currentDate = new Date();
        
        var ageDiff = currentDate.getFullYear() - dob.getFullYear();
        var isOver18 = (ageDiff > 18) || (ageDiff === 18 && currentDate.getMonth() > dob.getMonth()) || (ageDiff === 18 && currentDate.getMonth() === dob.getMonth() && currentDate.getDate() >= dob.getDate());
        
        if (!isOver18) {
            alert("You must be over 18 years old.");
            return false; // Prevent form submission
        }
        
        return true; // Allow form submission
    }
    </script>

    <script>
    // Set max date to today
    let today = new Date().toISOString().split('T')[0];
    document.getElementById("dob").setAttribute("max", today);
</script>

{% endblock %}
