{% extends 'common/usercommon.html' %}

{% load static %} 
{% block content %}

alert('{{m}}')

<div class="container">
    <h2 class="text-center">Electoral Identity Card Application</h2>
    <form method="post" enctype="multipart/form-data" onsubmit="return validateForm();">
        {% csrf_token %}

        <div class="mb-3">
            <label for="name" class="form-label">Name:</label>
            <input type="text" pattern="[A-Za-z ]+" class="form-control" id="father" placeholder="Enter Name" name="name" required>
        </div>

        <div class="mb-3">
            <label for="father" class="form-label">Father's Name:</label>
            <input type="text" pattern="[A-Za-z ]+" class="form-control" id="father" placeholder="Enter Father's Name" name="father" required>
        </div>




        <div class="mb-3">
            <label class="form-label">Father Email:</label>
            <input type="email" class="form-control" name="father_email" placeholder="Enter Father's Email" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Father Phone:</label>
            <input type="tel" pattern="[6-9][0-9]{9}" class="form-control" name="father_phone" placeholder="Enter 10-digit Phone Number" required maxlength="10">
        </div>

        <div class="mb-3">
            <label class="form-label">Father Address:</label>
            <textarea class="form-control" name="father_address" placeholder="Enter Father's Address" required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Father Proof:</label>
            <input type="file" class="form-control" name="father_proof" required>
        </div>












        <div class="mb-3">
            <label for="mother" class="form-label">Mother's Name:</label>
            <input type="text" pattern="[A-Za-z ]+" class="form-control" id="mother" placeholder="Enter Mother's Name" name="mother" required>
        </div>




        <div class="mb-3">
    <label class="form-label">Mother Email:</label>
    <input type="email" class="form-control" name="mother_email" placeholder="Enter Mother's Email" required>
</div>

<div class="mb-3">
    <label class="form-label">Mother Phone:</label>
    <input type="tel" pattern="[6-9][0-9]{9}" maxlength="10" class="form-control" name="mother_phone" placeholder="Enter 10-digit Phone Number" required>
</div>

<div class="mb-3">
    <label class="form-label">Mother Address:</label>
    <textarea class="form-control" name="mother_address" placeholder="Enter Mother's Address" required></textarea>
</div>

<div class="mb-3">
    <label class="form-label">Mother Proof:</label>
    <input type="file" class="form-control" name="mother_proof" required>
</div>






        <div class="mb-3">
            <label class="form-label">Gender:</label><br>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="gender" value="male" required>
                <label class="form-check-label">Male</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="gender" value="female">
                <label class="form-check-label">Female</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="gender" value="others">
                <label class="form-check-label">Others</label>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Marital Status:</label><br>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="martial" value="unmarried" required>
                <label class="form-check-label">Unmarried</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="martial" value="married">
                <label class="form-check-label">Married</label>
            </div>
        </div>

        <div class="mb-3">
            <label for="dob" class="form-label">Date of Birth:</label>
            <input type="date" class="form-control" id="dob" name="dob" required>
        </div>

        <div class="mb-3">
            <label for="place" class="form-label">Place of Birth:</label>
            <input type="text" class="form-control" id="place" placeholder="Enter Place of Birth" name="place" required>
        </div>

        <div class="mb-3">
            <label for="bloodGroup" class="form-label">Blood Group:</label>
            <select id="bloodGroup" name="blood" class="form-select">
                <option value="" selected disabled>Select</option>
                <option value="A+">A+</option>
                <option value="B+">B+</option>
                <option value="AB+">AB+</option>
                <option value="O+">O+</option>
                <option value="A-">A-</option>
                <option value="B-">B-</option>
                <option value="AB-">AB-</option>
                <option value="O-">O-</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="district" class="form-label">District:</label>
            <select id="district" name="district" class="form-select">
                <option value="Alappuzha">Alappuzha</option>
                <option value="Ernakulam">Ernakulam</option>
                <option value="Idukki">Idukki</option>
                <option value="Kannur">Kannur</option>
                <option value="Kasaragod">Kasaragod</option>
                <option value="Kollam">Kollam</option>
                <option value="Kottayam">Kottayam</option>
                <option value="Kozhikode">Kozhikode</option>
                <option value="Malappuram">Malappuram</option>
                <option value="Palakkad">Palakkad</option>
                <option value="Pathanamthitta">Pathanamthitta</option>
                <option value="Thiruvananthapuram">Thiruvananthapuram</option>
                <option value="Thrissur">Thrissur</option>
                <option value="Wayanad">Wayanad</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="address" class="form-label">Address:</label>
            <textarea class="form-control" id="address" placeholder="Enter Postal Address" name="address" rows="3" required></textarea>
        </div>

        <div class="mb-3">
            <label for="identification" class="form-label">Identification Proof:</label>
            <select name="identification" class="form-select">
                <option value="aadhar">Aadhar Card</option>
                <option value="driving_license">Driving License</option>
                <option value="pan_card">PAN Card</option>
                <option value="passport">Passport</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="idproof" class="form-label">Upload ID Proof:</label>
            <input type="file" class="form-control" name="idproof" required>
        </div>

        <div class="mb-3">
            <label for="photo" class="form-label">Upload Passport-sized Photo:</label>
            <input type="file" class="form-control" name="photo" required>
        </div>

        <div class="mb-3">
            <label for="addressproof" class="form-label">Upload Address Proof:</label>
            <input type="file" class="form-control" name="addressproof" required>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" name="declaration" required>
            <label class="form-check-label">I declare that the information provided is true and accurate.</label>
        </div>

        <button type="submit" class="btn btn-submit w-100">Submit Application</button>
    </form>
</div>
<script>
    function validateForm() {
        var dobInput = document.getElementById('dob');
        var dob = new Date(dobInput.value);
        var currentDate = new Date();
        
        var ageDiff = currentDate.getFullYear() - dob.getFullYear();
        var isOver18 = (ageDiff > 18) || (ageDiff === 18 && currentDate.getMonth() > dob.getMonth()) || (ageDiff === 18 && currentDate.getMonth() === dob.getMonth() && currentDate.getDate() >= dob.getDate());
        
        if (!isOver18) {
            alert("You must be over 18 years old.");
            return false; // Prevent form submission
        }
        
        return true; // Allow form submission
    }
    </script>

<style>
    .container {
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            margin-top: 50px;
        }
        h2 {
            margin-bottom: 20px;
            font-weight: bold;
        }
        .form-label {
            font-weight: bold;
        }
        .form-control, .form-select {
            border: 2px solid #ced4da;
        }
        .form-control:focus, .form-select:focus {
            border-color: #007bff;
            box-shadow: none;
        }
        .btn-submit {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
    
</style>

<script>
    // Set max date to today
    let today = new Date().toISOString().split('T')[0];
    document.getElementById("dob").setAttribute("max", today);
</script>
{% endblock %}
