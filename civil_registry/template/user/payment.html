{% extends 'common/usercommon.html' %}

{% load static %} 
{% block content %}

{% for m in messages %}
<script>
    alert('{{ m }}');
</script>
{% endfor %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow p-4">
                <div class="card-body">
                    <h2 class="text-center mb-3">User Registration</h2>
                    <p class="text-center text-danger">Service charge of 25 rupees will be deducted from your account</p>
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <input type="text" class="form-control" placeholder="Name" name="name" required>
                        </div>
                        
                        <div class="mb-3">
                            <input type="tel" class="form-control" minlength="16" maxlength="16" name="number" inputmode="numeric" placeholder="Card Number" required>
                        </div>
                        
                        <div class="mb-3">
                            <input type="text" class="form-control" maxlength="4" minlength="3" inputmode="numeric" name="cvv" placeholder="CVV" required>
                        </div>
                        
                        <div class="mb-3">
                            <input type="month" class="form-control" name="expiration-month-and-year" placeholder="MM / YY" required>
                        </div>
                        
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary w-100">Pay Now</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
