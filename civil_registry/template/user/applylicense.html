{% extends 'common/usercommon.html' %}

{% load static %} 
{% block content %}
{% for m in messages %}
<script>
alert('{{m}}')
</script>
    {% endfor %}
<div class="container mt-5">
    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white text-center">
            <h2>Application For Driving License</h2>
        </div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data" onsubmit="return validateForm()">
                {% csrf_token %}

                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label"><strong>Father's Name:</strong></label>
                            <input type="text" pattern="[A-Za-z ]+" class="form-control" placeholder="Father's Name" name="father" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label"><strong>Mother's Name:</strong></label>
                            <input type="text" pattern="[A-Za-z ]+" class="form-control" placeholder="Mother's Name" name="mother" required>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label"><strong>Gender:</strong></label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" value="male" required>
                        <label class="form-check-label">Male</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" value="female" required>
                        <label class="form-check-label">Female</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" value="others" required>
                        <label class="form-check-label">Others</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label"><strong>Kerala Learner's Number:</strong></label>
                    <input type="text" class="form-control" minlength="16" maxlength="16" placeholder="KL Learner's Number" name="klno" required>
                </div>

                <div class="mb-3">
                    <label class="form-label"><strong>Blood Group:</strong></label>
                    <select name="blood" class="form-select" required>
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="B+">B+</option>
                        <option value="AB+">AB+</option>
                        <option value="O+">O+</option>
                        <option value="A-">A-</option>
                        <option value="B-">B-</option>
                        <option value="AB-">AB-</option>
                        <option value="O-">O-</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label"><strong>Date of Birth:</strong></label>
                    <input type="date" class="form-control" name="dob" required>
                </div>

                <div class="mb-3">
                    <label class="form-label"><strong>Place:</strong></label>
                    <input type="text" class="form-control" placeholder="Place" name="place" required>
                </div>

                <div class="mb-3">
                    <label class="form-label"><strong>District:</strong></label>
                    <select name="district" class="form-select" required>
                        <option value="Alappuzha">Alappuzha</option>
                        <option value="Ernakulam">Ernakulam</option>
                        <option value="Idukki">Idukki</option>
                        <option value="Kannur">Kannur</option>
                        <option value="Kasaragod">Kasaragod</option>
                        <option value="Kollam">Kollam</option>
                        <option value="Kottayam">Kottayam</option>
                        <option value="Kozhikode">Kozhikode</option>
                        <option value="Malappuram">Malappuram</option>
                        <option value="Palakkad">Palakkad</option>
                        <option value="Pathanamthitta">Pathanamthitta</option>
                        <option value="Thiruvananthapuram">Thiruvananthapuram</option>
                        <option value="Thrissur">Thrissur</option>
                        <option value="Wayanad">Wayanad</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label"><strong>Postal Address:</strong></label>
                    <textarea class="form-control" name="address" rows="3" placeholder="Enter your address" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label"><strong>ID Type:</strong></label>
                    <select name="identification" class="form-select">
                        <option value="aadhar">Aadhar Card</option>
                        <option value="voters_id">Voter's ID</option>
                        <option value="driving_license">Driving License</option>
                        <option value="pan_card">PAN Card</option>
                        <option value="passport">Passport</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label"><strong>Upload ID Proof:</strong></label>
                    <input type="file" class="form-control" name="idproof">
                </div>

                <div class="mb-3">
                    <label class="form-label"><strong>Upload Passport-size Photo:</strong></label>
                    <input type="file" class="form-control" name="photo">
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" name="declaration" required>
                    <label class="form-check-label"><strong>I declare that the information provided is true and accurate.</strong></label>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-success"><strong>Register Now</strong></button>
                </div>
            </form>
        </div>
    </div>
</div>
<br>
<script>
    function validateForm() {
        var dobInput = document.getElementById('dob');
        var dob = new Date(dobInput.value);
        var currentDate = new Date();
        
        var ageDiff = currentDate.getFullYear() - dob.getFullYear();
        var isOver18 = (ageDiff > 18) || (ageDiff === 18 && currentDate.getMonth() > dob.getMonth()) || (ageDiff === 18 && currentDate.getMonth() === dob.getMonth() && currentDate.getDate() >= dob.getDate());
        
        if (!isOver18) {
            alert("You must be over 18 years old.");
            return false; // Prevent form submission
        }
        
        return true; // Allow form submission
    }
    </script>
{% endblock %}
