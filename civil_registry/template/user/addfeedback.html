{% extends 'common/usercommon.html' %}
{% load static %} 

{% block content %}


<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg p-4">
                <h2 class="text-center mb-4">Feedback</h2>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="form-group">
                        <textarea class="form-control" name="feedback" placeholder="Add Feedback" rows="5" required></textarea>
                    </div>
                    <div class="text-center mt-3">
                        <input type="submit" class="btn btn-primary" value="Submit Feedback">
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% for m in messages %}
<script>
alert('{{m}}')
</script>
{% endfor %}

{% endblock %}
