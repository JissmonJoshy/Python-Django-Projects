{% extends 'common/usercommon.html' %}

{% load static %} 
{% block content %}

<div class="container mt-5">
        <h2 class="text-center mb-4">Application for Death Certificate</h2>
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4 shadow">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="mb-3">
                            <input type="text" pattern="[A-Za-z]+" class="form-control" placeholder="Name of deceased" name="name" required>
                        </div>

                        <div class="mb-3">
                            <input type="text" pattern="[A-Za-z]+" class="form-control" placeholder="Father's name" name="father" required>
                        </div>

                        <div class="mb-3">
                            <input type="text" pattern="[A-Za-z]+" class="form-control" placeholder="Mother's name" name="mother" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Gender:</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="gender" value="male">
                                <label class="form-check-label">Male</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="gender" value="female">
                                <label class="form-check-label">Female</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="gender" value="others">
                                <label class="form-check-label">Others</label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Date of Death:</label>
                            <input type="date" class="form-control" name="dod" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Date of Birth:</label>
                            <input type="date" class="form-control" name="dob" required>
                        </div>

                        <div class="mb-3">
                            <input type="text" class="form-control" placeholder="Place of death" name="deathplace" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Death taken at:</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="death" value="home">
                                <label class="form-check-label">Died at home</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="death" value="hospital">
                                <label class="form-check-label">Died at hospital</label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">District:</label>
                            <select id="district" name="district" class="form-select">
                                <option value="Alappuzha">Alappuzha</option>
                                <option value="Ernakulam">Ernakulam</option>
                                <option value="Idukki">Idukki</option>
                                <option value="Kannur">Kannur</option>
                                <option value="Kasaragod">Kasaragod</option>
                                <option value="Kollam">Kollam</option>
                                <option value="Kottayam">Kottayam</option>
                                <option value="Kozhikode">Kozhikode</option>
                                <option value="Malappuram">Malappuram</option>
                                <option value="Palakkad">Palakkad</option>
                                <option value="Pathanamthitta">Pathanamthitta</option>
                                <option value="Thiruvananthapuram">Thiruvananthapuram</option>
                                <option value="Thrissur">Thrissur</option>
                                <option value="Wayanad">Wayanad</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <select class="form-select" name="taluk" id="taluk">
                                <!-- Taluk options will be dynamically populated -->
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Type of Death:</label>
                            <select id="type_of_death" name="type" class="form-select">
                                <option value="Natural">Natural</option>
                                <option value="Accidental">Accidental</option>
                                <option value="Suicide">Suicide</option>
                                <option value="Homicide">Homicide</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <textarea name="address" class="form-control" placeholder="Address of deceased"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Relation:</label>
                            <select name="relation" class="form-select">
                                <option value="son">Son</option>
                                <option value="daughter">Daughter</option>
                                <option value="wife">Wife</option>
                                <option value="husband">Husband</option>
                                <option value="father">Father</option>
                                <option value="mother">Mother</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">ID Proof:</label>
                            <select name="identification" class="form-select">
                                <option value="aadhar">Aadhar Card</option>
                                <option value="voters_id">Voter's ID</option>
                                <option value="driving_license">Driving License</option>
                                <option value="pan_card">PAN Card</option>
                                <option value="passport">Passport</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Upload ID Proof:</label>
                            <input type="file" name="idproof" class="form-control">
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" name="declaration" class="form-check-input" id="declaration" required>
                            <label class="form-check-label" for="declaration">I declare that the information provided is true and accurate.</label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Register Now</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var eventDateInput = document.getElementById('date'); // Corrected ID
        var today = new Date().toISOString().split('T')[0];
        eventDateInput.setAttribute('max', today);
  
        var form = document.querySelector('.contact-form');
        form.addEventListener('submit', function(event) {
            var selectedDate = new Date(eventDateInput.value);
            var currentDate = new Date();
  
            // Set current date to start of day
            currentDate.setHours(0, 0, 0, 0);
  
            if (selectedDate < currentDate) {
                alert("Date must be greater than today's date.");
                event.preventDefault(); // Prevent form submission
            }
        });
    });
  </script>
    <script>

          ],

          ],

          ],
          "Kozhikode": [
            "Thamarassery",
            "Koyilandy",
            "Vatakara",

          ],
          "Wayanad": ["Vythiri", "Sulthan Bathery", "Mananthavady"],
          "Kannur": ["Thalassery", "Iritty", "Kannur", "Taliparamba", "Payyanur"],
          "Kasaragod": ["Hosdurg", "Vellarikundu", "Kasaragod", "Manjeshwaram"]
        };
          
          const districtSelect = document.getElementById('district');
          const talukSelect = document.getElementById('taluk');
          
          districtSelect.addEventListener('change', () => {
            const selectedDistrict = districtSelect.value;
            const taluks = taluksByDistrict[selectedDistrict];
          
            talukSelect.innerHTML = '';
          
            taluks.forEach((taluk) => {
              const option = document.createElement('option');
              option.value = taluk;
              option.textContent = taluk;
              talukSelect.appendChild(option);
            });
          });
          
          // Call the event listener to populate taluks initially
          districtSelect.dispatchEvent(new Event('change'));
        </script>
{% endblock %}
