
{% extends 'common/common.html' %}
{% load static %}
{%  block content %}
{% for m in messages %}
<script>
alert('{{m}}')
</script>
{% endfor %}
<br>
<main class="d-flex justify-content-center align-items-center vh-100 bg-light">
    <div class="card shadow-lg p-4 rounded-4 form-container bg-white">
        <div class="card-body">
            <h2 class="mb-4 text-center text-primary fw-bold">User Registration</h2>
            <form method="post">{% csrf_token %}
                <div class="mb-3">
                    <input type="text" name="name" class="form-control input-custom" pattern="[A-Za-z]+" placeholder="Name" required>
                </div>
                <div class="mb-3">
                    <input type="email" name="email" class="form-control input-custom" placeholder="Email" required>
                </div>
                <div class="mb-3">
                    <input type="tel" name="phone" class="form-control input-custom" pattern="[789][0-9]{9}" minlength="10" maxlength="10" placeholder="Phone Number" required>
                </div>
                <div class="mb-3">
                    <input type="tel" name="aadhar" class="form-control input-custom" pattern="[0-9]{12}" minlength="12" maxlength="12" placeholder="Aadhar Number" required>
                </div>
                <div class="mb-3">
                    <select name="district" class="form-select input-custom" required>
                        <option value="" selected disabled>Select District</option>
                        <option value="Alappuzha">Alappuzha</option>
                        <option value="Ernakulam">Ernakulam</option>
                        <option value="Idukki">Idukki</option>
                        <option value="Kannur">Kannur</option>
                        <option value="Kasaragod">Kasaragod</option>
                        <option value="Kollam">Kollam</option>
                        <option value="Kottayam">Kottayam</option>
                        <option value="Kozhikode">Kozhikode</option>
                        <option value="Malappuram">Malappuram</option>
                        <option value="Palakkad">Palakkad</option>
                        <option value="Pathanamthitta">Pathanamthitta</option>
                        <option value="Thiruvananthapuram">Thiruvananthapuram</option>
                        <option value="Thrissur">Thrissur</option>
                        <option value="Wayanad">Wayanad</option>
                    </select>
                </div>
                <div class="mb-3">
                    <textarea name="address" class="form-control input-custom" placeholder="Address" rows="3" required></textarea>
                </div>
                <div class="mb-3">
                    <input type="password" name="password" class="form-control input-custom" placeholder="Password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold text-uppercase btn-custom">Register Now</button>
            </form>
        </div>
    </div>
</main>
<br>

{% endblock %}
