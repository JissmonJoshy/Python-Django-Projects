{% extends 'base.html' %} {% block content %} {% load static %}


        <!--================Header Area End =================-->
        <!--================Banner Area =================-->
        <section class="banner_area banner_one" style="margin-top: 0px;">
            <div class="container">
                <div class="content-align">
                    <div class="content-center">
                        <div class="banner_content">
                            <h3>Register</h3>
                        </div>
                        <div class="banner_link">
                            <div class="abnner_link_inner">
                                <a class="active" href="/">Home</a>
                                <a href="#"> Register As an Expert</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!--================End Banner Area =================-->
        
        <!--================Contact Us Area =================-->
        <section class="registration-area py-5">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-6 col-md-8">
                        <div class="registration-form p-4 shadow-lg rounded bg-light">
                            <h2 class="form-title text-center mb-4">Create Your Account</h2>
                            <form class="register-form" action="" method="POST" enctype="multipart/form-data">
                                {% csrf_token %}
        
                                <div class="form-group mb-3">
                                    <label for="username" class="form-label">Username</label>
                                    <input type="text" class="form-control" name="username" id="username" placeholder="Enter your username" required>
                                </div>
        
                                <div class="form-group mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" class="form-control" name="password" id="password" 
                                        placeholder="Enter your password" required 
                                        pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{6,}$"
                                        title="Password must contain at least one uppercase letter, one lowercase letter, and one digit, with a minimum length of 6 characters.">
                                </div>
                                
                                <div class="form-group mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" name="email" id="email" 
                                        placeholder="Enter your email" required 
                                        pattern="^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.(com|in)$"
                                        title="Enter a valid email address ending in .com or .in">
                                </div>
                                
                                <div class="form-group mb-3">
                                    <label for="contact" class="form-label">Contact</label>
                                    <input type="tel" class="form-control" name="contact" id="contact" 
                                        placeholder="Enter your contact number" required 
                                        pattern="[0-9]{10}" maxlength="10"
                                        title="Contact number must be exactly 10 digits.">
                                </div>
                                
        
                                <div class="form-group mb-3">
                                    <label for="address" class="form-label">Address</label>
                                    <textarea class="form-control" name="address" id="address" rows="3" placeholder="Enter your address" required></textarea>
                                </div>
        
                                <div class="form-group mb-4">
                                    <label for="file" class="form-label">Upload File</label>
                                    <input type="file" class="form-control" name="file" id="file" accept="image/*">
                                </div>
        
                                <div class="form-group text-center">
                                    <button type="submit" class="btn btn-primary btn-lg w-100">Register Now</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        
        
        <!--================End Contact Us Area =================-->


{% endblock %}
