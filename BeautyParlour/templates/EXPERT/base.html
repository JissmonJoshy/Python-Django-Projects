    {% load static %}

    <header class="main-header">
      <div class="header-menu bg-dark">
        <div class="container">
          <nav
            class="navbar navbar-expand-md affix"
            data-spy="affix"
            data-offset-top="197"
          >
            <!-- Logo -->
            <a class="navbar-brand" href="">
              <img src="{% static 'img/logo.png' %}" alt="Company Logo" />
            </a>

            <!-- Mobile Toggle Button -->
            <button
              class="navbar-toggler"
              type="button"
              data-toggle="collapse"
              data-target="#navbarSupportedContent"
              aria-controls="navbarSupportedContent"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation Menu -->
            <!-- Navigation Menu -->
            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <li class="nav-item">
                    <a class="nav-link" href="/expertHome">Home</a>
                </li>
            
                <!-- Customers Link -->
                

                <li class="nav-item">
                  <a class="nav-link" href="/assigned_customers">Customers</a>
              </li>
            
                <!-- Experts Link -->
                
            
                <!-- Logout Link -->
                <li class="nav-item">
                    <a class="nav-link text-danger" href="/">Logout</a>
                </li>
            </ul>
            

              <!-- Contact Info -->
              <div class="navbar-text ms-auto">
                {% comment %} <i class="fa fa-phone"></i> Call us: 7354-548-698
                {% endcomment %}
              </div>
            </div>
          </nav>
        </div>
      </div>
    </header>

    {% block content %}{% endblock %}

    <!-- Core JavaScript Libraries -->
    <script src="{% static 'js/jquery-2.2.4.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>

    <!-- Plugin Libraries -->
    <script src="{% static 'vendors/owl-carousel/owl.carousel.min.js' %}"></script>
    <script src="{% static 'vendors/isotope/imagesloaded.pkgd.min.js' %}"></script>
    <script src="{% static 'vendors/isotope/isotope.pkgd.min.js' %}"></script>
    <script src="{% static 'vendors/magnific-popup/jquery.magnific-popup.min.js' %}"></script>

    <!-- Additional Libraries -->
    <script src="{% static 'js/jquery.fancybox.pack.js' %}"></script>
    <script src="{% static 'js/jquery.mixitup.min.js' %}"></script>
    <script src="{% static 'js/jquery.appear.js' %}"></script>
    <script src="{% static 'js/jquery.countTo.js' %}"></script>
    <script src="{% static 'js/wow.min.js' %}"></script>

    <!-- Custom Scripts -->
    <script src="{% static 'js/gallery.js' %}"></script>
    <script src="{% static 'js/theme.js' %}"></script>
    <script src="{% static 'js/counternew.js' %}"></script>
    <script src="{% static 'js/mobilemenu.js' %}"></script>
    <script src="{% static 'dist/jquery-simple-mobilemenu.js' %}"></script>

    <!-- Google Maps (Add your API key to the src URL) -->
    {% if google_maps_api_key %}
    <script src="https://maps.google.com/maps/api/js?key={{ google_maps_api_key }}"></script>
    <script src="{% static 'js/map-script.js' %}"></script>
    {% endif %}
