{% extends 'ADMIN/base.html' %} {% block content %} {% load static %}

<section class="banner_area banner_one" style="margin-top: 0px">
  <div class="container">
    <div class="content-align">
      <div class="content-center">
        <div class="banner_content">
          <h3>Packages</h3>
        </div>
        <div class="banner_link">
          <div class="abnner_link_inner">
            <a class="active" href="/adminHome">Home</a>
            <a href="/addPackage"> Registeration for Expert</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>


<section class="registration-area py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
          <div class="registration-form p-4 shadow-lg rounded bg-light">
            <h2 class="form-title text-center mb-4">Register New Package</h2>
            <form
              class="service-form"
              action=""
              method="POST"
              enctype="multipart/form-data"
            >
              {% csrf_token %}
  
              <div class="form-group mb-3">
                <label for="name" class="form-label">Service Name</label>
                <input
                  type="text"
                  class="form-control"
                  name="name"
                  id="name"
                  placeholder="Enter service name"
                  required
                />
              </div>
  
              <div class="form-group mb-3">
                <label for="price" class="form-label">Price (INR)</label>
                <input
                  type="text"
                  class="form-control"
                  name="price"
                  id="price"
                  placeholder="Enter service price"
                  required
                />
              </div>
  
              <div class="form-group mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea
                  class="form-control"
                  name="description"
                  id="description"
                  rows="3"
                  placeholder="Enter service description"
                  required
                ></textarea>
              </div>
  
              <div class="form-group mb-3">
                <label for="category" class="form-label">Category</label>
                <select class="form-control" name="category" id="category" required>
                  <option value="shop">Shop</option>
                  <option value="home">Home</option>
                </select>
              </div>
  
              <div class="form-group mb-4">
                <label for="file" class="form-label">Upload Service Image</label>
                <input
                  type="file"
                  class="form-control"
                  name="file"
                  id="file"
                  accept="image/*"
                  required
                />
              </div>
  
              <div class="form-group text-center">
                <button type="submit" class="btn btn-primary btn-lg w-100">
                  Add Service
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>
  {% endblock %}
