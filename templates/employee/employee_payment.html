{% extends "employee/common.html" %}
{% load static %}

{% block content %}
<main>
<section class="section banner-inner">
    <div class="hero-container">
        <h1>Payment</h1>
        <p>Pay for {{ booking.part.part_name }}</p>
    </div>
</section>

<section class="section">
    <div class="hero-container">
        <div class="card card-appointment" style="max-width:400px; margin:auto; padding:20px;">

            <img src="{{ booking.part.image.url }}"
                 style="width:100%; height:150px; object-fit:cover; border-radius:10px;">

            <h3 class="mt-2">{{ booking.part.part_name }}</h3>
            <p><strong>Total Price:</strong> ₹{{ booking.total_price }}</p>

            <form method="POST">
                {% csrf_token %}
                <label>Cardholder Name</label>
                <input type="text" name="cardholder_name" required class="form-control mb-2">

                <label>Card Number</label>
                <input type="text" name="card_number" required class="form-control mb-2">

                <label>CVV</label>
                <input type="text" name="cvv" required class="form-control mb-2">

                <label>Expiry Date</label>
                <input type="month" name="expiry_date" required class="form-control mb-2">

                <button type="submit" class="btn btn-accent mt-2">Pay Now</button>
            </form>

        </div>
    </div>
</section>
</main>
{% endblock %}
