{% extends "user/common.html" %}
{% load static %}

{% block content %}
<main>

<section class="section banner-inner">
    <div class="hero-container">
        <h1>User Profile</h1>
    </div>
</section>

<section class="section">
    <div class="hero-container">
        <div class="row row-cols-xl-2 row-cols-1 grid-spacer-3">

            <!-- LEFT INFO -->
            <div class="col">
                <div class="d-flex flex-column gspace-2">
                    <h2>{{ user.full_name }}</h2>
                    <p>Email: {{ user.email }}</p>
                    <p>Mobile: {{ user.mobile }}</p>
                    <p>Address: {{ user.address }}</p>
                </div>
            </div>

            <!-- RIGHT CARD -->
            <div class="col">
                <div class="card card-appointment">
                    <img src="{{ user.profile_image.url }}" class="profile-img">

                    <a href="{% url 'user_profile_edit' %}" class="btn btn-accent mt-2">Edit Profile</a>
                </div>
            </div>

        </div>
    </div>
</section>

</main>
{% endblock %}
