{% extends "user/common.html" %}
{% load static %}

{% block content %}
<main>

<section class="section banner-inner">
    <div class="hero-container">
        <h1>Book Service</h1>
        <p>{{ service.service_name }}</p>
    </div>
</section>

<section class="section">
    <div class="hero-container">
        <div class="row row-cols-xl-2 row-cols-1 grid-spacer-3">

            <!-- LEFT INFO -->
            <div class="col">
                <div class="d-flex flex-column gspace-2">
                    <h2>Service Details</h2>
                    <p><strong>Operation:</strong> {{ service.operation }}</p>
                    <p><strong>Price:</strong> ₹{{ service.price }}</p>
                    <p>{{ service.description }}</p>
                </div>
            </div>

            <!-- RIGHT FORM -->
            <div class="col">
                <div class="card card-appointment">

                    <h3>Car Details</h3>

                    <form method="POST" enctype="multipart/form-data" class="form">
                        {% csrf_token %}

                        <input type="text" name="car_number"
                               placeholder="Car Number Plate" required>

                        <input type="text" name="car_name"
                               placeholder="Car Name / Model" required>

                        <textarea name="description" rows="4"
                                  placeholder="Describe what modification you want"
                                  required></textarea>

                        <input type="file" name="car_image" required>

                        <button type="submit" class="btn btn-accent">
                            Confirm Booking
                        </button>
                    </form>

                </div>
            </div>

        </div>
    </div>
</section>

</main>
{% endblock %}
